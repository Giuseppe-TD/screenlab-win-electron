<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Screenlab</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #1a1a1a;
    color: #fff;
    font-family: -apple-system,'Segoe UI',sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Toolbar ── */
  #toolbar {
    height: 44px; min-height: 44px;
    background: #252526;
    border-bottom: 1px solid #333;
    display: flex; align-items: center;
    padding: 0 8px; gap: 4px;
    overflow-x: auto; overflow-y: hidden;
    scrollbar-width: none;
    pointer-events: all;
    z-index: 100;
    position: relative;
  }
  #toolbar::-webkit-scrollbar { display: none; }

  .tbtn {
    background: #333; color: #fff; border: 1px solid #444;
    border-radius: 5px; padding: 4px 9px; font-size: 11px;
    cursor: pointer; white-space: nowrap;
    display: flex; align-items: center; justify-content: center; gap: 4px;
    height: 28px; min-width: 28px;
  }
  .tbtn:hover { background: #444; }
  .tbtn.active { background: #0d6efd; border-color: #0d6efd; }
  .tbsep { width: 1px; height: 20px; background: #444; margin: 0 4px; flex-shrink: 0; }

  #url-bar {
    display: flex; align-items: center;
    background: #1e1e1e; border: 1px solid #555;
    border-radius: 6px; padding: 0 8px;
    width: 380px; min-width: 160px; height: 30px;
  }
  #url-input {
    background: transparent; border: none; outline: none;
    color: #fff; font-size: 12px; flex: 1; min-width: 0;
  }
  #go-btn {
    background: none; border: none; color: #4fc3f7;
    cursor: pointer; font-size: 14px; padding: 0 2px;
  }
  #zoom-label {
    font-size: 11px; color: #888; font-family: Consolas,monospace;
    width: 36px; text-align: right;
  }
  input[type=range] { cursor: pointer; accent-color: #4fc3f7; }

  /* ── Layout ── */
  #layout {
    display: flex; flex: 1; overflow: hidden;
    position: relative;
  }

  /* ── Sidebar ── */
  #sidebar {
    width: 200px; min-width: 200px;
    background: #252526;
    display: flex; flex-direction: column;
    overflow: hidden;
    transition: width 0.15s, min-width 0.15s;
    pointer-events: all;
    z-index: 100;
    position: relative;
    border-right: 1px solid #333;
  }
  #sidebar.collapsed { width: 0; min-width: 0; }

  #sidebar-header {
    padding: 10px 12px; display: flex; align-items: center;
    gap: 8px; border-bottom: 1px solid #333; flex-shrink: 0;
  }
  .logo {
    width: 26px; height: 26px; border-radius: 6px;
    background: linear-gradient(135deg,#1A2E8C,#0D1960);
    display: flex; align-items: center; justify-content: center;
    font-weight: bold; font-size: 13px; flex-shrink: 0;
  }
  .logo-text h3 { font-size: 12px; font-weight: 700; }
  .logo-text p  { font-size: 9px; color: #888; }

  #device-list {
    flex: 1; overflow-y: auto; padding: 4px 0;
    scrollbar-width: thin; scrollbar-color: #444 transparent;
  }
  .cat-label {
    font-size: 9px; font-weight: 700; color: #666;
    padding: 8px 12px 2px; letter-spacing: 1px;
  }
  .device-row {
    display: flex; align-items: center; gap: 6px;
    padding: 2px 8px; cursor: pointer;
  }
  .device-row:hover { background: rgba(255,255,255,.05); }
  .device-row input[type=checkbox] { cursor: pointer; accent-color: #4fc3f7; flex-shrink: 0; }
  .device-info .name {
    font-size: 11px; color: #fff;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 130px;
  }
  .device-info .size { font-size: 9px; color: #666; font-family: Consolas,monospace; }

  #add-btn {
    margin: 6px 8px 8px; padding: 5px 10px;
    background: #2d2d2d; color: #4fc3f7;
    border: 1px solid #444; border-radius: 5px;
    cursor: pointer; font-size: 11px; text-align: left;
    flex-shrink: 0;
  }
  #add-btn:hover { background: #333; }

  /* ── Canvas area — pointer-events none così i click passano alle WebContentsView ── */
  #canvas {
    flex: 1;
    background: #1a1a1a;
    pointer-events: none;
    position: relative;
    overflow: hidden;
  }

  /* I placeholder sono div trasparenti che definiscono dove stanno le views */
  #cards-wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 24px;
    padding: 32px;
    align-items: flex-start;
    justify-content: flex-start;
    pointer-events: none;
  }

  .card-slot {
    display: flex;
    flex-direction: column;
    pointer-events: none;
  }

  /* Header della card — pointer-events: all per screenshot btn */
  .card-header {
    display: flex; align-items: center; gap: 6px;
    margin-bottom: 6px;
    pointer-events: all;
    background: rgba(30,30,30,0.85);
    backdrop-filter: blur(4px);
    border-radius: 6px;
    padding: 4px 8px;
  }
  .card-title .name {
    font-size: 11px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    color: #fff;
  }
  .card-title .size { font-size: 9px; color: #666; font-family: Consolas,monospace; }
  .card-title { flex: 1; }

  .ss-btn {
    background: #333; color: #aaa; border: 1px solid #444;
    border-radius: 4px; padding: 2px 7px; font-size: 10px;
    cursor: pointer; flex-shrink: 0;
  }
  .ss-btn:hover { background: #444; color: #fff; }

  /* Placeholder trasparente — la WebContentsView ci sta sopra */
  .card-view {
    border-radius: 20px;
    background: transparent;
    pointer-events: none;
    /* bordo visivo — viene da WPF come overlay ma qui è semplicemente CSS */
    box-shadow: 0 0 0 1px rgba(255,255,255,.12), 0 6px 20px rgba(0,0,0,.5);
  }

  /* ── Modal ── */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.6);
    z-index: 1000; display: flex; align-items: center; justify-content: center;
    pointer-events: all;
  }
  .modal {
    background: #252526; border-radius: 10px; padding: 22px; width: 440px;
    border: 1px solid #333;
  }
  .modal h3 { font-size: 14px; margin-bottom: 14px; }
  .modal label { display: block; font-size: 11px; color: #aaa; margin-bottom: 3px; }
  .modal input, .modal textarea {
    width: 100%; background: #1e1e1e; color: #fff;
    border: 1px solid #444; border-radius: 5px;
    padding: 5px 8px; font-size: 12px; margin-bottom: 10px; font-family: inherit;
  }
  .modal textarea { height: 60px; resize: none; font-family: Consolas,monospace; }
  .modal-row { display: flex; gap: 10px; }
  .modal-row > * { flex: 1; }
  .modal-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 2px; }
  .btn-cancel  { background: #333; color: #fff; border: 1px solid #444; border-radius: 5px; padding: 5px 14px; cursor: pointer; font-size: 12px; }
  .btn-primary { background: #0d6efd; color: #fff; border: none; border-radius: 5px; padding: 5px 14px; cursor: pointer; font-size: 12px; }
</style>
</head>
<body>

<!-- TOOLBAR -->
<div id="toolbar">
  <button class="tbtn" id="btn-sidebar" title="Sidebar">☰</button>
  <button class="tbtn" id="btn-back">◀</button>
  <button class="tbtn" id="btn-fwd">▶</button>
  <div id="url-bar">
    <span style="font-size:11px;color:#666;margin-right:6px">🌐</span>
    <input id="url-input" type="text" placeholder="https://" spellcheck="false">
    <button id="go-btn">▶</button>
  </div>
  <button class="tbtn" id="btn-reload">↺</button>
  <div class="tbsep"></div>
  <button class="tbtn" id="btn-devtools">DevTools</button>
  <div class="tbsep"></div>
  <button class="tbtn" id="btn-live">⚡ Live</button>
  <select id="live-sel" style="display:none;background:#333;color:#fff;border:1px solid #444;border-radius:5px;padding:2px 5px;font-size:11px">
    <option value="1">1s</option><option value="2">2s</option>
    <option value="3" selected>3s</option><option value="5">5s</option>
  </select>
  <button class="tbtn" id="btn-sync">⇅ Sync</button>
  <div class="tbsep"></div>
  <button class="tbtn" id="btn-zoom-m" style="width:26px;font-size:16px;font-weight:300">−</button>
  <input type="range" id="zoom-sl" min="15" max="100" value="50" style="width:80px">
  <button class="tbtn" id="btn-zoom-p" style="width:26px;font-size:16px;font-weight:300">+</button>
  <span id="zoom-label">50%</span>
  <div class="tbsep"></div>
  <input type="range" id="spacing-sl" min="8" max="80" value="24" style="width:60px" title="Spaziatura">
  <div class="tbsep"></div>
  <button class="tbtn" id="btn-screenshot-all" title="Screenshot tutti">📷</button>
</div>

<!-- LAYOUT -->
<div id="layout">
  <div id="sidebar">
    <div id="sidebar-header">
      <div class="logo">S</div>
      <div class="logo-text">
        <h3>Screenlab</h3>
        <p id="active-count">0 attivi</p>
      </div>
    </div>
    <div id="device-list"></div>
    <button id="add-btn">+ Aggiungi dispositivo</button>
  </div>

  <!-- Canvas trasparente — le WebContentsView stanno sotto -->
  <div id="canvas">
    <div id="cards-wrap"></div>
  </div>
</div>

<!-- Modal aggiunta dispositivo -->
<div class="modal-backdrop" id="modal" style="display:none">
  <div class="modal">
    <h3>Aggiungi dispositivo</h3>
    <label>Nome</label>
    <input id="m-name" type="text" placeholder="es. Custom Phone">
    <div class="modal-row">
      <div><label>Larghezza</label><input id="m-w" type="number" value="390"></div>
      <div><label>Altezza</label><input id="m-h" type="number" value="844"></div>
    </div>
    <label>User Agent</label>
    <textarea id="m-ua">Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15</textarea>
    <div class="modal-btns">
      <button class="btn-cancel" id="m-cancel">Annulla</button>
      <button class="btn-primary" id="m-ok">Aggiungi</button>
    </div>
  </div>
</div>

<script src="devices.js"></script>
<script src="renderer.js"></script>
</body>
</html>
